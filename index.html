<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LDX | Portais LDX</title>
    <link rel="icon" type="image/png" href="img.png">
    
    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg-dark: #050507;
            --glass-bg: rgba(20, 20, 25, 0.6); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #8b5cf6; 
            --accent-secondary: #ec4899; 
            --accent-cyan: #06b6d4; 
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            /* Cores Vibrantes para as 3 Páginas (Cards) */
            --color-gamehub: #06b6d4; 
            --color-nexushub: #ec4899; 
            --color-centralhub: #facc15;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, h3, .logo { font-family: 'Space Grotesk', sans-serif; }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #050507;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        .loader-content { text-align: center; position: relative; }
        
        .loader-logo { 
            font-size: 3rem; 
            font-weight: 700; 
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(90deg, #facc15, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 0.8s forwards 0.2s;
        }

        .loader-bar-container {
            width: 200px; height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeUp 0.8s forwards 0.4s;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: #06b6d4;
            box-shadow: 0 0 15px #06b6d4;
            animation: loadProgress 1.5s ease-in-out forwards 0.6s;
        }

        .loader-text {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s forwards 0.5s;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }

        .loaded #loader { opacity: 0; visibility: hidden; }

        /* --- BACKGROUND --- */
        .ambient-light {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            animation: floatOrb 25s infinite alternate ease-in-out;
        }

        .orb-1 { width: 500px; height: 500px; background: #ec4899; top: -150px; left: -150px; animation-duration: 30s; }
        .orb-2 { width: 600px; height: 600px; background: #06b6d4; bottom: -150px; right: -150px; animation-duration: 35s; animation-delay: -5s; }
        .orb-3 { width: 350px; height: 350px; background: #facc15; top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.25; animation: pulseOrb 12s infinite ease-in-out; }

        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 90px) scale(1.1); } }
        @keyframes pulseOrb { 0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.9); } 50% { opacity: 0.35; transform: translate(-50%, -50%) scale(1.1); } }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; position: relative; z-index: 1; padding-bottom: 2rem; opacity: 0; /* Esconde conteúdo inicialmente */ transition: opacity 1s ease 1s; }
        .loaded .container { opacity: 1; }

        /* --- HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 2rem 0; position: relative; }
        
        .logo { 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
            display: flex; 
            align-items: center; 
            gap: 15px; 
            user-select: none;
        }

        /* ÍCONE ESPECIAL (Bússola) */
        .logo-icon-special {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #06b6d4, #ec4899);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6));
            animation: specialPulse 3s infinite ease-in-out;
        }

        @keyframes specialPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(10deg); }
        }

        .clock { background: rgba(20, 20, 25, 0.8); border: 1px solid rgba(255,255,255,0.15); padding: 8px 18px; border-radius: 100px; font-family: 'Space Grotesk', monospace; font-size: 0.9rem; color: var(--accent-cyan); backdrop-filter: blur(20px); box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); font-weight: 600; letter-spacing: 1px; user-select: none;}

        /* --- HERO --- */
        .hero { text-align: center; margin: 4rem 0 4rem; position: relative; }
        
        @keyframes colorCycle {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero h1 { 
            font-size: 4rem; font-weight: 700; line-height: 1.1; margin-bottom: 1rem;
            background: linear-gradient(90deg, #facc15, #8b5cf6, #ec4899, #06b6d4, #22c55e, #ef4444, #f59e0b, #ffffff, #facc15);
            background-size: 300% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            animation: colorCycle 6s linear infinite;
            letter-spacing: -2px; 
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.5)); 
            user-select: none;
        }
        
        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; padding: 0 10px; font-weight: 400; min-height: 1.5em; /* Reserva espaço para o texto */ }

        /* --- HUBS GRID --- */
        .hubs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 2rem 0;
            transition: all 0.3s ease;
        }

        /* --- HUB CARD STYLE --- */
        .hub-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden; 
            transition: transform 0.1s linear, box-shadow 0.4s ease, border-color 0.3s ease, background 0.3s ease;
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform;
            user-select: none;
            text-align: center;
            cursor: pointer;
        }

        .hub-card::after {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg); transition: 0.6s; pointer-events: none; z-index: 2; 
        }
        .hub-card:hover::after { left: 150%; transition: 0.8s ease-in-out; }
        .hub-card:hover { background: rgba(30, 30, 35, 0.8); border-color: rgba(255,255, 255, 0.4); }
        
        .hub-card.clicked { transform: scale(0.96); opacity: 0.8; }
        
        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple-anim 0.6s ease-out;
            pointer-events: none; z-index: 1; 
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        .hub-bg-icon { position: absolute; right: -20px; bottom: -20px; font-size: 8rem; opacity: 0.03; transform: rotate(-15deg); pointer-events: none; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1; }
        .hub-card:hover .hub-bg-icon { opacity: 0.08; transform: rotate(0deg) scale(1.1); }
        
        .hub-content { position: relative; z-index: 10 !important; transform: translateZ(30px); display: flex; flex-direction: column; align-items: center; gap: 1.5rem; pointer-events: none; }

        .hub-icon {
            width: 90px; height: 90px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .hub-card h2 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
        .hub-card p { font-size: 1rem; color: var(--text-muted); line-height: 1.5; font-weight: 400; }

        /* --- ESPECÍFICO COLORIDO POR CARD (HOVER) --- */

        /* GameHub */
        .card-gamehub .hub-icon { 
            color: var(--color-gamehub); 
            text-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .card-gamehub:hover .hub-icon { 
            background: var(--color-gamehub); 
            color: white;
            transform: translateY(-8px) scale(1.1) rotate(-5deg); 
            border-color: transparent; 
            box-shadow: 0 0 60px rgba(6, 182, 212, 0.6); 
        }
        .card-gamehub:hover { 
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3), 0 30px 60px -15px rgba(6, 182, 212, 0.4); 
            border-color: rgba(6, 182, 212, 0.5); 
        }

        /* NexusHub */
        .card-nexushub .hub-icon { 
            color: var(--color-nexushub); 
            text-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            border-color: rgba(236, 72, 153, 0.3);
        }
        .card-nexushub:hover .hub-icon { 
            background: var(--color-nexushub); 
            color: white;
            transform: translateY(-8px) scale(1.1) rotate(5deg); 
            border-color: transparent; 
            box-shadow: 0 0 60px rgba(236, 72, 153, 0.6); 
        }
        .card-nexushub:hover { 
            box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.3), 0 30px 60px -15px rgba(236, 72, 153, 0.4); 
            border-color: rgba(236, 72, 153, 0.5); 
        }

        /* CentralHub */
        .card-centralhub .hub-icon { 
            color: var(--color-centralhub); 
            text-shadow: 0 0 30px rgba(250, 204, 21, 0.5);
            border-color: rgba(250, 204, 21, 0.3);
        }
        .card-centralhub:hover .hub-icon { 
            background: var(--color-centralhub); 
            color: white;
            transform: translateY(-8px) scale(1.1); 
            border-color: transparent; 
            box-shadow: 0 0 60px rgba(250, 204, 21, 0.6); 
        }
        .card-centralhub:hover { 
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.3), 0 30px 60px -15px rgba(250, 204, 21, 0.4); 
            border-color: rgba(250, 204, 21, 0.5); 
        }

        /* --- TRANSITION OVERLAY (NOVA ANIMAÇÃO) --- */
        .page-transition-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 99999; /* Acima de tudo */
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
        }
        
        /* Classe adicionada via JS para iniciar animação */
        .animating-overlay {
            transition: transform 0.7s cubic-bezier(0.6, 0, 0.2, 1); /* Curva suave e "rápida" no final */
        }

        /* --- FOOTER --- */
        footer { 
            text-align: center; 
            padding: 3rem 0; 
            color: var(--text-muted); 
            border-top: 1px solid var(--glass-border); 
            margin-top: 5rem; 
            font-size: 0.8rem; 
            letter-spacing: 0.5px; 
            position: relative; 
            z-index: 2; 
            background: transparent; 
            user-select: none;
        }

        /* --- MOBILE LAYOUT --- */
        @media (max-width: 768px) { 
            .hero h1 { font-size: 2.5rem; } 
            .hero p { font-size: 1rem; }
            
            .hubs-grid { 
                grid-template-columns: 1fr !important; 
                gap: 1rem;
                padding: 1rem 0;
            }
            
            .hub-card { 
                flex-direction: row; 
                justify-content: flex-start; 
                align-items: center;
                text-align: left; 
                padding: 1.25rem 1.5rem;
                min-height: auto; 
                height: auto;
                gap: 1.5rem;
            }

            .hub-content {
                flex-direction: row;
                align-items: center;
                gap: 1.25rem;
                width: 100%;
            }

            .hub-icon { 
                width: 55px; 
                height: 55px; 
                font-size: 1.5rem; 
                flex-shrink: 0; 
                margin-bottom: 0;
            }

            .hub-card h2 { font-size: 1.25rem; margin-bottom: 0.2rem; }
            .hub-card p { font-size: 0.85rem; margin: 0; }

            .hub-bg-icon { display: none; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo">LDX</div>
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
            <div class="loader-text">Inicializando Sistemas</div>
        </div>
    </div>

    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <!-- ÍCONE ESPECIAL (BÚSSOLA) + Texto LDX -->
            <div class="logo">
                <i class="fa-solid fa-compass logo-icon-special"></i> LDX
            </div>
            <div class="clock" id="clock">00:00</div>
        </header>

        <section class="hero">
            <h1>Portais LDX.</h1>
            <p id="greeting-text">...</p>
        </section>

        <div class="hubs-grid" id="bentoGrid">
            
            <!-- CARD: GAMEHUB -->
            <a href="https://deathzephyr.github.io/GameHub/" target="_self" class="hub-card card-gamehub" data-color="#06b6d4">
                <div class="hub-bg-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="hub-content">
                    <div class="hub-icon"><i class="fa-solid fa-gamepad"></i></div>
                    <div>
                        <h2>GameHub</h2>
                        <p>O universo dos jogos ao seu alcance.</p>
                    </div>
                </div>
                <span class="ripple"></span>
            </a>

            <!-- CARD: NEXUSHUB -->
            <a href="https://deathzephyr.github.io/NexusHub/" target="_self" class="hub-card card-nexushub" data-color="#ec4899">
                <div class="hub-bg-icon"><i class="fa-solid fa-layer-group"></i></div>
                <div class="hub-content">
                    <div class="hub-icon"><i class="fa-solid fa-layer-group"></i></div>
                    <div>
                        <h2>NexusHub</h2>
                        <p>Tecnologia e entretenimento.</p>
                    </div>
                </div>
                <span class="ripple"></span>
            </a>

            <!-- CARD: CENTRALHUB -->
            <a href="https://deathzephyr.github.io/CentralHub/" target="_self" class="hub-card card-centralhub" data-color="#facc15">
                <div class="hub-bg-icon"><i class="fa-solid fa-globe"></i></div>
                <div class="hub-content">
                    <div class="hub-icon"><i class="fa-solid fa-globe"></i></div>
                    <div>
                        <h2>CentralHub</h2>
                        <p>Serviços digitais oficiais e essenciais.</p>
                    </div>
                </div>
                <span class="ripple"></span>
            </a>

        </div>

        <footer>
            <p>DESIGN BY LDX © 2026</p>
        </footer>
    </div>

    <script>
        /* --- LOADER SYSTEM --- */
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            // Tempo mínimo de 1.8s para o usuário ver a animação
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 1800);
        });

        /* --- GREETING & CLOCK --- */
        function updateTimeAndGreeting() {
            const now = new Date();
            const hours = now.getHours();
            const timeString = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            // Atualiza Relógio
            document.getElementById('clock').textContent = timeString;

            // Atualiza Saudação
            const greetingEl = document.getElementById('greeting-text');
            let greeting = "Seja bem-vindo.";
            
            if (hours >= 5 && hours < 12) {
                greeting = "Bom dia, viajante.";
            } else if (hours >= 12 && hours < 18) {
                greeting = "Boa tarde, viajante.";
            } else if (hours >= 18 && hours < 24) {
                greeting = "Boa noite, viajante.";
            } else {
                greeting = "Boa madrugada, insone.";
            }
            
            if (greetingEl.textContent !== greeting + " Selecione seu destino e acesse o melhor conteúdo.") {
                greetingEl.textContent = greeting + " Selecione seu destino e acesse o melhor conteúdo.";
            }
        }
        
        setInterval(updateTimeAndGreeting, 1000);
        updateTimeAndGreeting(); // Executa na carga

        /* --- TILT3D, RIPPLE & PAGE TRANSITION --- */
        const hubCards = document.querySelectorAll('.hub-card');
        
        hubCards.forEach(card => {
            // Efeito 3D Tilt (Apenas Desktop)
            card.addEventListener('mousemove', (e) => {
                if(window.innerWidth > 768) {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -10;
                    const rotateY = ((x - centerX) / centerX) * 10;
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
                }
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            });

            // --- MELHORIA: ANIMAÇÃO DE NAVEGAÇÃO ---
            card.addEventListener('click', function(e) {
                // Previne a navegação imediata para podermos animar
                e.preventDefault();
                
                const targetUrl = this.getAttribute('href');
                const color = this.getAttribute('data-color');
                
                // 1. Efeito visual de clique imediato (Scale down)
                this.classList.add('clicked');
                setTimeout(() => this.classList.remove('clicked'), 200);

                // 2. Efeito Ripple (Ondinha) existente
                const ripple = this.querySelector('.ripple');
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const size = Math.max(rect.width, rect.height);
                
                ripple.style.width = ripple.style.height = `${size}px`;
                ripple.style.left = `${x - size / 2}px`;
                ripple.style.top = `${y - size / 2}px`;
                ripple.style.animation = 'none';
                void ripple.offsetWidth; // Trigger reflow
                ripple.style.animation = 'ripple-anim 0.6s ease-out';

                // 3. Criar Overlay de Transição (O "Curtain" colorido)
                const overlay = document.createElement('div');
                overlay.classList.add('page-transition-overlay', 'animating-overlay');
                overlay.style.backgroundColor = color;
                
                // Posiciona o overlay exatamente onde o mouse clicou (em relação ao viewport)
                overlay.style.left = `${e.clientX}px`;
                overlay.style.top = `${e.clientY}px`;
                
                document.body.appendChild(overlay);

                // Força o navegador a processar a posição inicial antes de animar
                void overlay.offsetWidth;

                // Expande o overlay até cobrir a tela (valor de scale alto garante cobertura)
                // Usamos um scale grande (ex: 50 ou 100) para cobrir qualquer resolução
                overlay.style.transform = 'translate(-50%, -50%) scale(60)';

                // 4. Navega após a animação (700ms)
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 700);
            });
        });

        /* --- CONTROLE DE GRID (MOBILE E PC) --- */
        const bentoGrid = document.getElementById('bentoGrid');

        function loadSavedGrid() {
            let savedCols;
            let key;
            
            if (window.innerWidth <= 768) {
                key = 'nexusHub_mobileCols';
                savedCols = localStorage.getItem(key);
                if(!savedCols) savedCols = '1'; 
            } else {
                key = 'nexusHub_desktopCols';
                savedCols = localStorage.getItem(key);
                if(!savedCols) savedCols = '3';
            }
            
            if (window.innerWidth > 768) {
                bentoGrid.style.gridTemplateColumns = savedCols === 'auto' ? '' : `repeat(${savedCols}, 1fr)`;
            } else {
                bentoGrid.style.gridTemplateColumns = '1fr';
            }
        }
        
        loadSavedGrid();

        let lastWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            if (window.innerWidth !== lastWidth) {
                lastWidth = window.innerWidth;
                loadSavedGrid();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LDX | Portais LDX</title>
    <link rel="icon" type="image/png" href="img.png">
    
    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg-dark: #050507;
            --glass-bg: rgba(20, 20, 25, 0.6); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            /* Cores Vibrantes para os Portais */
            --color-gamehub: #06b6d4; 
            --color-nexushub: #ec4899; 
            --color-centralhub: #facc15;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            /* Prevenir rolagem durante animação */
            transition: filter 0.5s ease;
        }

        /* Estado de navegação (ativa blur no fundo) */
        body.is-navigating .container {
            filter: blur(10px) brightness(0.3);
            transform: scale(0.95);
            transition: all 0.6s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }

        h1, h2, h3, .logo { font-family: 'Space Grotesk', sans-serif; }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            inset: 0;
            background: #050507;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        .loader-content { text-align: center; position: relative; }
        
        .loader-logo { 
            font-size: 3rem; 
            font-weight: 700; 
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(90deg, #facc15, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 0.8s forwards 0.2s;
        }

        .loader-bar-container {
            width: 200px; height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeUp 0.8s forwards 0.4s;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: #06b6d4;
            box-shadow: 0 0 15px #06b6d4;
            animation: loadProgress 1.5s ease-in-out forwards 0.6s;
        }

        .loader-text {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.8s forwards 0.5s;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }

        .loaded #loader { opacity: 0; visibility: hidden; }

        /* --- BACKGROUND --- */
        .ambient-light {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            animation: floatOrb 25s infinite alternate ease-in-out;
        }

        .orb-1 { width: 500px; height: 500px; background: #ec4899; top: -150px; left: -150px; animation-duration: 30s; }
        .orb-2 { width: 600px; height: 600px; background: #06b6d4; bottom: -150px; right: -150px; animation-duration: 35s; animation-delay: -5s; }
        .orb-3 { width: 350px; height: 350px; background: #facc15; top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.25; animation: pulseOrb 12s infinite ease-in-out; }

        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 90px) scale(1.1); } }
        @keyframes pulseOrb { 0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(0.9); } 50% { opacity: 0.35; transform: translate(-50%, -50%) scale(1.1); } }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; position: relative; z-index: 1; padding-bottom: 2rem; opacity: 0; transition: opacity 1s ease 1s; }
        .loaded .container { opacity: 1; }

        /* --- HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 2rem 0; position: relative; }
        
        .logo { 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: #ffffff; 
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
            display: flex; 
            align-items: center; 
            gap: 15px; 
            user-select: none;
        }

        .logo-icon-special {
            font-size: 1.4rem;
            background: linear-gradient(135deg, #06b6d4, #ec4899);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.6));
            animation: specialPulse 3s infinite ease-in-out;
        }

        @keyframes specialPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(10deg); }
        }

        .clock { background: rgba(20, 20, 25, 0.8); border: 1px solid rgba(255,255,255,0.15); padding: 8px 18px; border-radius: 100px; font-family: 'Space Grotesk', monospace; font-size: 0.9rem; color: var(--accent-cyan); backdrop-filter: blur(20px); box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); font-weight: 600; letter-spacing: 1px; user-select: none;}

        /* --- HERO --- */
        .hero { text-align: center; margin: 4rem 0 4rem; position: relative; }
        
        @keyframes colorCycle {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero h1 { 
            font-size: 4rem; font-weight: 700; line-height: 1.1; margin-bottom: 1rem;
            background: linear-gradient(90deg, #facc15, #8b5cf6, #ec4899, #06b6d4, #22c55e, #ef4444, #f59e0b, #ffffff, #facc15);
            background-size: 300% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            animation: colorCycle 6s linear infinite;
            letter-spacing: -2px; 
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.5)); 
            user-select: none;
        }
        
        .hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; padding: 0 10px; font-weight: 400; min-height: 1.5em; }

        /* --- HUBS GRID --- */
        .hubs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            padding: 2rem 0;
        }

        /* --- HUB CARD STYLE --- */
        .hub-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden; 
            transition: transform 0.1s linear, box-shadow 0.4s ease, border-color 0.3s ease, background 0.3s ease;
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform;
            user-select: none;
            text-align: center;
            cursor: pointer;
        }

        .hub-card:hover { background: rgba(30, 30, 35, 0.8); border-color: rgba(255,255, 255, 0.4); }
        
        .hub-bg-icon { position: absolute; right: -20px; bottom: -20px; font-size: 8rem; opacity: 0.03; transform: rotate(-15deg); pointer-events: none; transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 1; }
        .hub-card:hover .hub-bg-icon { opacity: 0.08; transform: rotate(0deg) scale(1.1); }
        
        .hub-content { position: relative; z-index: 10 !important; transform: translateZ(30px); display: flex; flex-direction: column; align-items: center; gap: 1.5rem; pointer-events: none; }

        .hub-icon {
            width: 90px; height: 90px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .hub-card h2 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
        .hub-card p { font-size: 1rem; color: var(--text-muted); line-height: 1.5; font-weight: 400; }

        /* Específicos das Cores (Hover) */
        .card-gamehub .hub-icon { color: var(--color-gamehub); border-color: rgba(6, 182, 212, 0.3); text-shadow: 0 0 30px rgba(6, 182, 212, 0.5); }
        .card-gamehub:hover .hub-icon { background: var(--color-gamehub); color: white; transform: translateY(-8px) scale(1.1) rotate(-5deg); box-shadow: 0 0 60px rgba(6, 182, 212, 0.6); }
        
        .card-nexushub .hub-icon { color: var(--color-nexushub); border-color: rgba(236, 72, 153, 0.3); text-shadow: 0 0 30px rgba(236, 72, 153, 0.5); }
        .card-nexushub:hover .hub-icon { background: var(--color-nexushub); color: white; transform: translateY(-8px) scale(1.1) rotate(5deg); box-shadow: 0 0 60px rgba(236, 72, 153, 0.6); }

        .card-centralhub .hub-icon { color: var(--color-centralhub); border-color: rgba(250, 204, 21, 0.3); text-shadow: 0 0 30px rgba(250, 204, 21, 0.5); }
        .card-centralhub:hover .hub-icon { background: var(--color-centralhub); color: white; transform: translateY(-8px) scale(1.1); box-shadow: 0 0 60px rgba(250, 204, 21, 0.6); }

        /* --- WARP CLONE (O Elemento que voa até a tela) --- */
        .warp-clone {
            position: fixed;
            z-index: 99999;
            top: 0; left: 0;
            pointer-events: none;
            /* Sombras intensas para parecer uma porta */
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 24px;
        }
        
        /* Classe para animação do clone */
        .warp-clone.zooming {
            transition: all 0.7s cubic-bezier(0.6, -0.28, 0.735, 0.045); /* Efeito 'Bouncy' rápido */
            border-radius: 0; /* Fica quadrado no final */
        }

        .warp-clone .warp-icon {
            font-size: 8rem;
            transition: transform 0.6s ease-out, opacity 0.6s ease;
            transform: scale(1);
            opacity: 1;
            filter: drop-shadow(0 0 50px rgba(255,255,255,0.5));
        }

        .warp-clone.zooming .warp-icon {
            transform: scale(4); /* O ícone vem em sua direção */
            opacity: 0; /* Some ao entrar na 'câmera' */
        }

        /* --- FOOTER --- */
        footer { text-align: center; padding: 3rem 0; color: var(--text-muted); border-top: 1px solid var(--glass-border); margin-top: 5rem; font-size: 0.8rem; position: relative; z-index: 2; user-select: none; }

        /* --- MOBILE --- */
        @media (max-width: 768px) { 
            .hero h1 { font-size: 2.5rem; } 
            .hero p { font-size: 1rem; }
            .hubs-grid { grid-template-columns: 1fr !important; gap: 1rem; padding: 1rem 0; }
            .hub-card { flex-direction: row; justify-content: flex-start; align-items: center; text-align: left; padding: 1.25rem 1.5rem; min-height: auto; height: auto; gap: 1.5rem; }
            .hub-content { flex-direction: row; align-items: center; gap: 1.25rem; width: 100%; }
            .hub-icon { width: 55px; height: 55px; font-size: 1.5rem; flex-shrink: 0; margin-bottom: 0; }
            .hub-card h2 { font-size: 1.25rem; margin-bottom: 0.2rem; }
            .hub-card p { font-size: 0.85rem; margin: 0; }
            .hub-bg-icon { display: none; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo">LDX</div>
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
            <div class="loader-text">Inicializando Sistemas</div>
        </div>
    </div>

    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-compass logo-icon-special"></i> LDX
            </div>
            <div class="clock" id="clock">00:00</div>
        </header>

        <section class="hero">
            <h1>Portais LDX.</h1>
            <p id="greeting-text">...</p>
        </section>

        <div class="hubs-grid" id="bentoGrid">
            
            <!-- CARD: GAMEHUB -->
            <a href="https://deathzephyr.github.io/GameHub/" target="_self" class="hub-card card-gamehub" data-color="#06b6d4" data-icon="fa-gamepad">
                <div class="hub-bg-icon"><i class="fa-solid fa-gamepad"></i></div>
                <div class="hub-content">
                    <div class="hub-icon"><i class="fa-solid fa-gamepad"></i></div>
                    <div>
                        <h2>GameHub</h2>
                        <p>O universo dos jogos ao seu alcance.</p>
                    </div>
                </div>
            </a>

            <!-- CARD: NEXUSHUB -->
            <a href="https://deathzephyr.github.io/NexusHub/" target="_self" class="hub-card card-nexushub" data-color="#ec4899" data-icon="fa-layer-group">
                <div class="hub-bg-icon"><i class="fa-solid fa-layer-group"></i></div>
                <div class="hub-content">
                    <div class="hub-icon"><i class="fa-solid fa-layer-group"></i></div>
                    <div>
                        <h2>NexusHub</h2>
                        <p>Tecnologia e entretenimento.</p>
                    </div>
                </div>
            </a>

            <!-- CARD: CENTRALHUB -->
            <a href="https://deathzephyr.github.io/CentralHub/" target="_self" class="hub-card card-centralhub" data-color="#facc15" data-icon="fa-globe">
                <div class="hub-bg-icon"><i class="fa-solid fa-globe"></i></div>
                <div class="hub-content">
                    <div class="hub-icon"><i class="fa-solid fa-globe"></i></div>
                    <div>
                        <h2>CentralHub</h2>
                        <p>Serviços digitais oficiais e essenciais.</p>
                    </div>
                </div>
            </a>

        </div>

        <footer>
            <p>DESIGN BY LDX © 2026</p>
        </footer>
    </div>

    <script>
        /* --- LOADER SYSTEM --- */
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 1800);
        });

        /* --- GREETING & CLOCK --- */
        function updateTimeAndGreeting() {
            const now = new Date();
            const hours = now.getHours();
            const timeString = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            document.getElementById('clock').textContent = timeString;

            const greetingEl = document.getElementById('greeting-text');
            let greeting = "Seja bem-vindo.";
            
            if (hours >= 5 && hours < 12) greeting = "Bom dia, viajante.";
            else if (hours >= 12 && hours < 18) greeting = "Boa tarde, viajante.";
            else if (hours >= 18 && hours < 24) greeting = "Boa noite, viajante.";
            else greeting = "Boa madrugada, insone.";
            
            if (greetingEl.textContent !== greeting + " Selecione seu destino e acesse o melhor conteúdo.") {
                greetingEl.textContent = greeting + " Selecione seu destino e acesse o melhor conteúdo.";
            }
        }
        
        setInterval(updateTimeAndGreeting, 1000);
        updateTimeAndGreeting();

        /* --- TILT3D & WARP ZOOM EFFECT --- */
        const hubCards = document.querySelectorAll('.hub-card');
        
        hubCards.forEach(card => {
            // Efeito 3D Tilt
            card.addEventListener('mousemove', (e) => {
                if(window.innerWidth > 768) {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -10;
                    const rotateY = ((x - centerX) / centerX) * 10;
                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
                }
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            });

            // --- NOVO EFEITO: WARP ZOOM (SITE APROXIMANDO-SE) ---
            card.addEventListener('click', function(e) {
                e.preventDefault(); // Para o link imediato

                const targetUrl = this.getAttribute('href');
                const color = this.getAttribute('data-color');
                const iconClass = this.getAttribute('data-icon');
                const rect = this.getBoundingClientRect();

                // 1. Criar o Clone do Portal
                const warpClone = document.createElement('div');
                warpClone.classList.add('warp-clone');
                
                // Configurar estilo inicial (exatamente onde o card está)
                warpClone.style.width = `${rect.width}px`;
                warpClone.style.height = `${rect.height}px`;
                warpClone.style.top = `${rect.top}px`;
                warpClone.style.left = `${rect.left}px`;
                warpClone.style.backgroundColor = color;
                
                // Adicionar ícone gigante dentro do clone
                const warpIcon = document.createElement('i');
                warpIcon.className = `fa-solid ${iconClass} warp-icon`;
                warpIcon.style.color = 'white';
                warpClone.appendChild(warpIcon);

                document.body.appendChild(warpClone);

                // 2. Iniciar a animação (Frame seguinte para garantir o navegador renderizou a posição inicial)
                requestAnimationFrame(() => {
                    // Adiciona classe que ativa a transição
                    warpClone.classList.add('zooming');
                    document.body.classList.add('is-navigating');

                    // Define o estado final: Cobrir a tela inteira
                    warpClone.style.top = '0';
                    warpClone.style.left = '0';
                    warpClone.style.width = '100vw';
                    warpClone.style.height = '100vh';
                    
                    // Opcional: Ajustar cor do fundo suavemente
                    warpClone.style.boxShadow = 'inset 0 0 100px rgba(0,0,0,0.8)';
                });

                // 3. Navegar quando a tela estiver coberta (após 650ms)
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 650);
            });
        });

        /* --- GRID CONTROL --- */
        const bentoGrid = document.getElementById('bentoGrid');
        function loadSavedGrid() {
            let savedCols;
            let key = window.innerWidth <= 768 ? 'nexusHub_mobileCols' : 'nexusHub_desktopCols';
            savedCols = localStorage.getItem(key) || (window.innerWidth <= 768 ? '1' : '3');
            
            if (window.innerWidth > 768) {
                bentoGrid.style.gridTemplateColumns = savedCols === 'auto' ? '' : `repeat(${savedCols}, 1fr)`;
            } else {
                bentoGrid.style.gridTemplateColumns = '1fr';
            }
        }
        loadSavedGrid();

        let lastWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            if (window.innerWidth !== lastWidth) {
                lastWidth = window.innerWidth;
                loadSavedGrid();
            }
        });
    </script>
</body>
</html>
